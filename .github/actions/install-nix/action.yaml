name: Install Nix
description: Install Nix consistently across the repository workflows

inputs:
  extra-conf:
    description: Additional nix.conf settings required by the job
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
      with:
        source-tag: v3.24.1
        summarize: false
        kvm: false
        extra-conf: |
          extra-experimental-features = parallel-eval
          eval-cores = 2
          ${{ inputs.extra-conf }}
        github-token: ${{ github.token }}
