name: Native darwin package cache
'on':
  push:
    branches:
    - native-cache
  pull_request: null
  workflow_dispatch:
    inputs:
      package:
        description: Package attribute, or all for the complete native matrix
        required: true
        default: all
        type: string
permissions:
  contents: read
concurrency:
  group: pared-darwin-${{ github.ref }}-${{ inputs.package || 'all' }}
  cancel-in-progress: false
jobs:
  docs-installer-smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ./.github/actions/install-nix
    - name: Verify Determinate client and daemon
      run: 'nix --version | grep -F ''Determinate Nix 3.24.1''

        nix store info --store daemon --json

        '
  plan:
    if: ${{ vars.DAVE_FORK_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_jobs: ${{ steps.matrix.outputs.has_jobs }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Install pinned workflow test parser
      run: 'python3 -m venv "$RUNNER_TEMP/cache-tests"

        "$RUNNER_TEMP/cache-tests/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3

        echo "$RUNNER_TEMP/cache-tests/bin" >> "$GITHUB_PATH"

        '
    - name: Credential-free cache helper and workflow regressions
      run: 'for test in ci/test-*.py; do python3 "$test"; done

        python3 ci/release-channel.py policy

        '
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
      with:
        source-tag: v3.24.1
        summarize: false
        kvm: false
        extra-conf: 'experimental-features = nix-command flakes parallel-eval

          eval-cores = 2

          accept-flake-config = false

          '
    - name: Verify Determinate client and daemon
      run: 'nix --version | grep -F ''Determinate Nix 3.24.1''

        nix store info --store daemon --json

        '
    - id: matrix
      env:
        SELECTED_PACKAGE: ${{ inputs.package || 'all' }}
      run: 'matrix=$(python3 ci/matrix.py darwin --package "$SELECTED_PACKAGE")

        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

        '
  build:
    needs: plan
    if: ${{ needs.plan.outputs.has_jobs == 'true' }}
    name: ${{ matrix.package }} (${{ matrix.system }}, ${{ matrix.set }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
      with:
        source-tag: v3.24.1
        summarize: false
        kvm: false
        extra-conf: 'experimental-features = nix-command flakes parallel-eval

          eval-cores = 2

          accept-flake-config = false

          http2 = false

          connect-timeout = 15

          download-attempts = 3

          substituters = https://cache.nixos.org/

          extra-substituters =

          extra-trusted-public-keys = niks3.monke.fail-1:q13GqiZgAxx7SyoLZInXoJjviZMOdNpfG03xs0VUD2M=

          max-jobs = 1

          cores = 3

          '
    - name: Verify Determinate client and daemon
      run: 'nix --version | grep -F ''Determinate Nix 3.24.1''

        nix store info --store daemon --json

        '
    - name: Configure read-only Niks3 access with GitHub OIDC
      if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: python3 ci/configure-niks3.py --oidc
    - name: Evaluate and build every output of the selected native package or check
      env:
        TARGET_SYSTEM: ${{ matrix.system }}
        TARGET_PACKAGE: ${{ matrix.package }}
        TARGET_SET: ${{ matrix.set }}
      run: "set -euo pipefail\ntest \"$(nix eval --impure --raw --expr builtins.currentSystem)\" = \"$TARGET_SYSTEM\"\ncase \"$TARGET_SET\" in packages|checks) ;; *) exit 2 ;; esac\ntarget=\".#$TARGET_SET.$TARGET_SYSTEM.$TARGET_PACKAGE\"\npython3 ci/public-closure.py \"$target\"\nSECONDS=0\npython3 ci/retain-build-outputs.py --target \"$target\" --manifest cache-outputs.txt -- nix build \"$target^*\" --fallback --no-update-lock-file --no-write-lock-file --no-link --print-out-paths -L > outputs.txt\n{\n  echo \"Built $TARGET_PACKAGE for $TARGET_SYSTEM\"\n  echo \"Package build: ${SECONDS}s\"\n  cat outputs.txt\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Remove private read credentials before exporting build data
      if: ${{ always() }}
      run: python3 ci/configure-niks3.py --cleanup
    - name: Save selected runtime closures independently of cache publication
      timeout-minutes: 15
      env:
        ATTIC_MAX_CLOSURE_MIB: ${{ startsWith(matrix.package, 't3code') && (vars.ATTIC_T3_MAX_CLOSURE_MIB || '8192') || (vars.ATTIC_MAX_CLOSURE_MIB || '4096') }}
      run: python3 ci/transfer-attic.py export --directory attic-transfer --manifest cache-outputs.txt
      id: cache_transfer
      if: ${{ always() && !cancelled() && hashFiles('cache-outputs.txt') != '' }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: nix-${{ matrix.system }}-${{ matrix.set }}-${{ matrix.package }}-${{ github.sha }}
        path: attic-transfer/
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        overwrite: false
      if: ${{ always() && !cancelled() && steps.cache_transfer.outcome == 'success' }}
    permissions:
      contents: read
      id-token: write
  publish:
    permissions:
      contents: read
      id-token: write
    needs:
    - plan
    - build
    if: ${{ always() && !cancelled() && ((needs.build.result == 'success' || needs.build.result == 'failure') && (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && needs.plan.outputs.has_jobs == 'true' && (vars.NIKS3_PUSH_ENABLED || vars.ATTIC_PUSH_ENABLED) == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    name: Publish ${{ matrix.package }} (${{ matrix.system }}, ${{ matrix.set }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3
      with:
        source-tag: v3.24.1
        summarize: false
        kvm: false
        extra-conf: 'experimental-features = nix-command flakes parallel-eval

          eval-cores = 2

          accept-flake-config = false

          substituters = https://cache.nixos.org/

          extra-substituters =

          '
    - name: Verify Determinate client and daemon
      run: 'nix --version | grep -F ''Determinate Nix 3.24.1''

        nix store info --store daemon --json

        '
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: nix-${{ matrix.system }}-${{ matrix.set }}-${{ matrix.package }}-${{ github.sha }}
        path: attic-transfer
    - name: Read Niks3 before installing the pinned publisher
      run: python3 ci/configure-niks3.py --oidc
    - name: Install pinned Niks3 publisher
      run: bash ci/install-niks3.sh --retain-bootstrap
    - name: Publish bootstrap client and completed build dependencies
      run: python3 ci/push-niks3.py --outputs niks3-bootstrap-outputs.txt
    - name: Import data without running any package programs
      timeout-minutes: 15
      env:
        ATTIC_MAX_CLOSURE_MIB: ${{ startsWith(matrix.package, 't3code') && (vars.ATTIC_T3_MAX_CLOSURE_MIB || '8192') || (vars.ATTIC_MAX_CLOSURE_MIB || '4096') }}
      run: python3 ci/transfer-attic.py import --directory attic-transfer
    - name: Publish to Niks3 with GitHub OIDC and verify S3 integrity
      run: python3 ci/push-niks3.py --outputs attic-transfer/outputs.txt
    - name: Remove job-local Niks3 reader
      if: ${{ always() }}
      run: python3 ci/configure-niks3.py --cleanup
