name: PR cache publisher checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Credential-free publisher regression tests
        run: |
          python3 ci/test-push-attic.py
          python3 ci/test-push-niks3.py
